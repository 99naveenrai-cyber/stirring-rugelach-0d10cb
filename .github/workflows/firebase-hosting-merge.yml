# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  checks: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Detect reviewed backend changes
        id: reviewed_changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            before="$(git rev-parse HEAD^)"
          fi

          changed_files="$(git diff --name-only "$before" "${{ github.sha }}")"
          printf '%s\n' "$changed_files"

          functions_changed=false
          firestore_rules_changed=false
          if grep -Eq '^functions/' <<<"$changed_files"; then
            functions_changed=true
          fi
          if grep -Fxq 'firestore.rules' <<<"$changed_files"; then
            firestore_rules_changed=true
          fi

          echo "functions=$functions_changed" >> "$GITHUB_OUTPUT"
          echo "firestore_rules=$firestore_rules_changed" >> "$GITHUB_OUTPUT"
      - name: Apply thumbnail hotfix
        run: node scripts/apply-thumbnail-hotfix.js
      - name: Normalize thumbnail hotfix
        run: node scripts/ensure-thumbnail-hotfix.js
      - name: Verify thumbnail hotfix
        shell: bash
        run: |
          check() {
            local label="$1"
            local pattern="$2"
            if grep -Eq "$pattern" index.html; then
              echo "PASS: $label"
            else
              echo "FAIL: $label"
              return 1
            fi
          }

          check "mqdefault thumbnail fallback exists" 'mqdefault'
          check "mobile thumbnail height is moderate and responsive" 'height:[[:space:]]*clamp\([[:space:]]*160px,[[:space:]]*48vw,[[:space:]]*190px[[:space:]]*\)'
          check "playlist card desktop thumbnail width is moderate" 'minmax\([[:space:]]*118px,[[:space:]]*30%[[:space:]]*\)'
      - name: Verify Functions
        working-directory: functions
        run: |
          npm ci
          npm run lint
          npm run build
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify Firestore security rules
        run: npx --yes firebase-tools@15.24.0 emulators:exec --only auth,firestore --project ideakdc-rules-test "npm --prefix functions run test:rules"
      - name: Configure reviewed backend deployment credentials
        if: steps.reviewed_changes.outputs.functions == 'true' || steps.reviewed_changes.outputs.firestore_rules == 'true'
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IDEAKDC_24B0B }}
        run: |
          set -euo pipefail
          credentials_file="$RUNNER_TEMP/ideakdc-firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"
      - name: Deploy reviewed Functions
        if: steps.reviewed_changes.outputs.functions == 'true'
        run: npx --yes firebase-tools@15.24.0 deploy --only functions --project ideakdc-24b0b --non-interactive
      - name: Deploy reviewed Firestore rules
        if: steps.reviewed_changes.outputs.firestore_rules == 'true'
        run: npx --yes firebase-tools@15.24.0 deploy --only firestore:rules --project ideakdc-24b0b --non-interactive
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IDEAKDC_24B0B }}
          channelId: live
          projectId: ideakdc-24b0b
      - name: Remove temporary backend credentials
        if: always() && (steps.reviewed_changes.outputs.functions == 'true' || steps.reviewed_changes.outputs.firestore_rules == 'true')
        shell: bash
        run: rm -f "$RUNNER_TEMP/ideakdc-firebase-service-account.json"
      - name: Report Firebase deployment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='ideakdc/firebase-deploy' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            -f description='Firebase deployment workflow passed'
      - name: Report Firebase deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='ideakdc/firebase-deploy' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            -f description='Firebase deployment workflow failed'

# Security hardening deployment trigger
