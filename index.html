  requestAnimationFrame(() => layer.classList.add('show'));
  const correctResolution = resolveQuizCorrectOption(question);
  const correctOptionId = correctResolution.optionId;
  layer.querySelectorAll('.quiz-option').forEach(button => {
    bindFastQuizOption(button, () => {
      const selectedOption = button.dataset.optionId;
      const localCorrect = correctOptionId ? String(correctOptionId) === String(selectedOption) : null;
      logQuizAnswerTap(question, selectedOption, correctOptionId, localCorrect);
      submitQuizAnswer(activeLessonQuiz.course, activeLessonQuiz.lesson, 'popup', question, selectedOption, layer, popupConfig);
      if (localCorrect === true) {
        const qid = String(question.id);
        if (!activeLessonQuiz.correctThisSession.has(qid)) {
          activeLessonQuiz.correctThisSession.add(qid);
          activeLessonQuiz.correctCount += 1;
          const popupTotal = activeLessonQuiz.quizData.popupQuiz?.timestamps?.length || 0;
          triggerQuizMilestone(layer, activeLessonQuiz.correctCount, popupTotal > 0 && activeLessonQuiz.correctCount >= popupTotal);
        }
        window.setTimeout(() => {
          dismissPopup(layer);
        }, 1500);
      }
    });
  });
}

async function openVideoPlayer(course, startIdx, meta = {}) {
  const videos = course.videos || [];
  if (!videos.length) {
    showCourseViewerState('Videos missing', 'Course à¤®à¤¿à¤²à¤¾, à¤²à¥‡à¤•à¤¿à¤¨ à¤‡à¤¸à¤®à¥‡à¤‚ à¤…à¤­à¥€ videos/playlists upload à¤¨à¤¹à¥€à¤‚ à¤¹à¥ˆà¤‚à¥¤', 'error');
    return;
  }
  const access = await getCourseAccess(course.id, course);
  renderCourseViewerHeader(course, access);
  const playlistCourse = isPlaylistCourse(course);
  window.showLockedLessonPrompt = (courseId) => {
    const lockedCourse = resolveCourseById(courseId) || course;
    renderPurchasePrompt(lockedCourse, 'This lesson is locked.');
  };
  const nextPlayableLessonIndex = (currentIdx) => {
    for (let i = currentIdx + 1; i < videos.length; i++) {
      const nextLesson = videos[i];
      const nextRule = getLessonAccessRule(course, i, access);
      if ((nextLesson?.contentId || nextLesson?.lessonId) && nextRule.canPlay) return i;
    }
    return -1;
  };
  const startNextLessonAfterEnd = (currentIdx) => {
    const nextIdx = nextPlayableLessonIndex(currentIdx);
    if (nextIdx < 0) return;
    showToast('Next lesson starting...', 'success');
    window.clearTimeout(window._nextLessonTimer);
    window._nextLessonTimer = window.setTimeout(() => {
      window.playFromPlaylist(nextIdx, { autoplay: true });
    }, 3000);
  };
  const allowed = getLessonAccessRule(course, startIdx, access).canPlay === true;
  if (!allowed) {
    pushPage('video');
    pushHistory();
    const wrap = document.getElementById('video-wrap');
    const selectedInfo = document.getElementById('selected-lesson-info');
    const qaSlot = document.getElementById('course-qa-slot');
    const list = document.getElementById('full-playlist');
    if (wrap) {
      wrap.innerHTML = `
        <div class="video-placeholder">
          ${renderThumbFrame({ src: getCourseThumbnail(course), alt: `${course.name || 'Course'} thumbnail`, fallback: course.emoji || 'ðŸ“š', courseId: course.id })}
        </div>`;
    }
    if (selectedInfo) {
      selectedInfo.innerHTML = '';
      renderPurchasePrompt(course, 'This paid lesson is locked. Purchase this course to watch the full video.');
    }
    if (qaSlot) qaSlot.innerHTML = renderCourseFaqs(course);
    if (list) list.innerHTML = playlistCourse ? renderLockedPlaylistPreview(course, access) : '';
    return;
  }
  let initialIdx = Number.isInteger(startIdx) && startIdx >= 0 && startIdx < videos.length ? startIdx : 0;
  if (!(videos[initialIdx]?.contentId || videos[initialIdx]?.lessonId)) {
    initialIdx = videos.findIndex(v => v.contentId || v.lessonId);
  }
  if (initialIdx < 0) {
    debugCourseOpen({
      courseId: course?.id || '',
      access: true,
      courseFound: true,
      videoCount: videos.length,
      playlistCount: videos.filter(v => v.contentType === 'playlist' || v.hasProtectedPlaylist).length,
      reason: 'no-lesson-metadata'
    });
    showCourseViewerState('Course data incomplete', 'Course unlock à¤¹à¥ˆ, à¤²à¥‡à¤•à¤¿à¤¨ lesson metadata missing à¤¹à¥ˆà¥¤ Admin à¤•à¥‹ content record à¤ à¥€à¤• à¤•à¤°à¤¨à¤¾ à¤¹à¥‹à¤—à¤¾à¥¤', 'error');
    return;
  }

  window._currentCourse  = course;
  window._currentVideos  = videos;
  window._currentMeta    = meta;

  const renderPlaylist = (activeIdx) => {
    const listEl = document.getElementById('full-playlist');
    if (!listEl) return;
    if (!playlistCourse) {
      if (listEl) listEl.innerHTML = '';
      return;
    }
    const groups = buildLessonGroups(course);
    if (!groups.length) {
      listEl.innerHTML = `
        <div class="course-viewer-state error">
          <strong>Course has no lessons</strong>
          <p>à¤‡à¤¸ course à¤®à¥‡à¤‚ à¤…à¤­à¥€ à¤•à¥‹à¤ˆ lesson upload à¤¨à¤¹à¥€à¤‚ à¤¹à¥ˆà¥¤</p>
          <button class="btn-enroll" onclick="showDashboard()">Back to My Courses</button>
        </div>`;
      return;
    }
    listEl.innerHTML = `
      <div class="full-playlist-header">ðŸ“‹ Course Contents â€” ${videos.length} lessons</div>
      ${groups.map(group => `
        <section class="lesson-section">
          <div class="lesson-section-title">${escapeHtml(group.title || 'Lessons')}</div>
          ${group.desc ? `<div class="lesson-section-desc">${escapeHtml(group.desc)}</div>` : ''}
          ${group.lessons.length ? group.lessons.map((v) => {
            const i = v.originalIndex;
            const accessRule = getLessonAccessRule(course, i, access);
            const canPlayLesson = !!(v.contentId || v.lessonId) && accessRule.canPlay;
            const visibleLesson = safePlaylistLessonForViewer(v, accessRule);
            const thumbSrc = getLessonThumbnail(v) || getLessonThumbnail(visibleLesson) || getCourseThumbnail(course);
            return `
              <button type="button" class="pl-item ${i===activeIdx?'playing':''} ${canPlayLesson?'':'locked'}"
                onclick="${canPlayLesson ? `playFromPlaylist(${i})` : `showLockedLessonPrompt('${course.id}')`}" ${v.contentId || v.lessonId ? '' : 'disabled'}>
                ${renderThumbFrame({ src: thumbSrc, candidates: getLessonThumbnailCandidates(v, course), alt: `${visibleLesson.title || 'Lesson'} thumbnail`, mini: true, fallback: 'â–¶', courseId: course.id, lessonId: v.contentId || v.lessonId || '', lessonIndex: i + 1 })}
                <div class="pl-num">${i+1}</div>
                <div class="pl-info">
                  <div class="pl-title">${escapeHtml(visibleLesson.title || 'Untitled lesson')}</div>
                  ${visibleLesson.desc ? `<div class="pl-desc">${escapeHtml(visibleLesson.desc)}</div>` : ''}
                  <div class="pl-dur">â± ${escapeHtml(lessonDuration(visibleLesson) || 'Duration not set')}</div>
                  <div class="pl-badges">${lessonStatusBadges({ course, lesson: visibleLesson, index: i, activeIdx, accessRule })}</div>
                </div>
                <div class="pl-play-icon">${canPlayLesson ? (i===activeIdx?'â–¶':'â–·') : 'ðŸ”’'}</div>
              </button>`;
          }).join('') : `
            <div class="course-viewer-state error">
              <strong>Playlist is empty</strong>
              <p>à¤‡à¤¸ playlist à¤®à¥‡à¤‚ à¤…à¤­à¥€ videos à¤¨à¤¹à¥€à¤‚ à¤®à¤¿à¤²à¥‡à¥¤</p>
            </div>`}
        </section>`).join('')}`;
  };
  window._renderCurrentPlaylist = renderPlaylist;

  window.playFromPlaylist = async (idx, options = {}) => {
    const v = videos[idx];
    if (!v) {
      showCourseViewerState('Video is unavailable', 'Selected lesson à¤¨à¤¹à¥€à¤‚ à¤®à¤¿à¤²à¤¾à¥¤', 'error');
      return;
    }
    const lessonRule = getLessonAccessRule(course, idx, access);
    if (!lessonRule.canPlay) {
      renderPurchasePrompt(course, 'This lesson is locked.');
      return;
    }
    const preserveScrollY = window.scrollY;
    const iframeId = `lesson-player-${Date.now()}`;
    const origin = encodeURIComponent(window.location.origin);
    let resolvedLesson;
    try {
      const result = await getAuthorizedLessonVideoFn({
        courseId: course.id,
        lessonId: v.contentId || v.lessonId || ''
      });
      resolvedLesson = result.data || {};
    } catch (error) {
      console.warn('[IdeaKDC lesson-video] protected video denied or unavailable', {
        courseId: course.id,
        lessonId: v.contentId || v.lessonId || '',
        code: error.code || error.message
      });
      renderPurchasePrompt(course, error.code === 'functions/permission-denied'
        ? 'This lesson is locked. Purchase this course to watch it.'
        : 'This lesson is not available yet.');
      const wrap = document.getElementById('video-wrap');
      if (wrap) {
        wrap.innerHTML = `<div class="video-placeholder"><div class="v-icon">ðŸ”’</div><div>Purchase required</div></div>`;
      }
      return;
    }
    const resolvedSource = resolvedLesson.videoId || resolvedLesson.videoUrl || '';
    const sourceType = resolvedLesson.sourceType || detectVideoSourceType(resolvedSource);
    const selectedVideoId = sourceType === 'youtube' ? extractYouTubeVideoId(resolvedSource) : '';
    const nativeVideoUrl = sourceType === 'native' ? String(resolvedLesson.videoUrl || resolvedSource || '').trim() : '';
    const embedSrc = selectedVideoId
      ? `https://www.youtube.com/embed/${selectedVideoId}?rel=0&playsinline=1&enablejsapi=1&origin=${origin}&autoplay=1`
      : '';

    destroyActiveLessonPlayer();
    window.clearTimeout(window._nextLessonTimer);
    window._activeLessonIndex = idx;
    await configurePopupQuizForPlayer(course, v, idx);
    document.getElementById('video-wrap').innerHTML = embedSrc
      ? `<iframe id="${iframeId}" src="${embedSrc}"
          title="${escapeHtml(v.title || 'IdeaKDC lesson player')}"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>`
      : nativeVideoUrl
        ? `<video id="${iframeId}" src="${escapeHtml(nativeVideoUrl)}" controls playsinline preload="metadata" autoplay aria-label="${escapeHtml(v.title || 'IdeaKDC lesson player')}"></video>`
        : `<div class="video-placeholder"><div class="v-icon">âš ï¸</div><div>Unsupported or unavailable video source</div></div>`;
    if (embedSrc) {
      ensureYouTubeIframeApi()
        .then((YT) => {
          window._activeLessonPlayer = new YT.Player(iframeId, {
            events: {
              onStateChange: (event) => {
                if (event.data === YT.PlayerState.ENDED) startNextLessonAfterEnd(idx);
              },
              onReady: (event) => {
                window.clearInterval(window._popupQuizTimer);
                window._popupQuizTimer = window.setInterval(() => maybeShowTimedPopupQuiz(event.target), 350);
                try { event.target.playVideo(); } catch (_) {}
              }
            }
          });
        })
        .catch((error) => console.warn('[IdeaKDC player] YouTube ended hook unavailable', error?.message || error));
    } else if (nativeVideoUrl) {
      const nativePlayer = document.getElementById(iframeId);
      nativePlayer?.addEventListener('ended', () => startNextLessonAfterEnd(idx), { once: true });
      window._activeLessonPlayer = nativePlayer;
    }
    document.getElementById('video-title').textContent = '';
    renderSelectedLessonInfo(course, v, idx);
    renderLessonActionControls(course, v, idx, !!(embedSrc || nativeVideoUrl));
    if (playlistCourse) {
      renderPlaylist(idx);
      keepSelectedLessonVisibleInsidePlaylist();
    } else {
      renderPlaylist(idx);
      const qaSlot = document.getElementById('course-qa-slot');
      const selectedInfo = document.getElementById('selected-lesson-info');
      if (qaSlot) qaSlot.innerHTML = '';
      if (selectedInfo) selectedInfo.innerHTML = '';
    }
    if (hasSeparateQuiz(v)) {
      await window.startLessonQuiz(idx, 'separate', { withVideo: true });
    }
    setLessonRoute(course.id, v.contentId || '', true);
    window.scrollTo({ top: preserveScrollY, behavior: 'auto' });
    requestAnimationFrame(() => window.scrollTo({ top: preserveScrollY, behavior: 'auto' }));
  };

  renderPlaylist(initialIdx);
  pushPage('video');
  pushHistory();
  if (playlistCourse) {
    setTimeout(() => window.playFromPlaylist(initialIdx), 100);
  } else {
    renderStandaloneReadyState(course, videos[initialIdx], initialIdx);
    if (hasSeparateQuiz(videos[initialIdx])) {
      setTimeout(() => window.startLessonQuiz(initialIdx, 'separate', { withVideo: true }), 100);
    }
  }
}

window.doSearch = () => {
  const q   = document.getElementById('search-input').value.trim().toLowerCase();
  const res = document.getElementById('search-results');
  if (!q) { res.classList.remove('show'); return; }

  const results = [];
  allCourses.forEach(c => {
    (c.videos||[]).forEach((v,i) => {
      if (v.title.toLowerCase().includes(q) ||
          (c.name||''  ).toLowerCase().includes(q) ||
          (c.tag||''   ).toLowerCase().includes(q) ||
          (c.subject||''  ).toLowerCase().includes(q) ||
          (v.chapter||''  ).toLowerCase().includes(q)) {
        results.push({ course:c, video:v, idx:i });
      }
    });
  });

  if (!results.length) {
    res.innerHTML = '<div class="search-result-item" style="color:var(--muted)">à¤•à¥‹à¤ˆ result à¤¨à¤¹à¥€à¤‚ à¤®à¤¿à¤²à¤¾à¥¤</div>';
  } else {
    res.innerHTML = results.slice(0,8).map(r => `
      <div class="search-result-item" onclick="searchOpen('${r.course.id}',${r.idx})">
        <div class="search-result-title">${r.video.title}</div>
        <div class="search-result-meta">${r.course.name} â€¢ ${r.video.dur||''}</div>
      </div>`).join('');
  }
  res.classList.add('show');
};

};

  const btn = document.getElementById(btnId);

    if (lel) lel.textContent = label;
  } else {
    btn.textContent = label;
  }
}
